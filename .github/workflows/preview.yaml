# https://github.github.io/actions-cheat-sheet/actions-cheat-sheet.html
# https://github.com/actions/checkout

on:
  push:
    branches:
      - 'master'
  pull_request:
  workflow_dispatch:

name: html-preview

jobs:
  enumerate:
    name: Enumerate changed files
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
      diff_before: ${{ steps.diff_range.outputs.diff_before }}
      diff_after: ${{ steps.diff_range.outputs.diff_after }}
    steps:
      # https://stackoverflow.com/a/74268200
      - uses: actions/checkout@v6
        with:
            fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - name: Get diff range to compare
        id: diff_range
        run: |
            if ${{ github.event_name == 'pull_request' }}; then
                echo "diff_before=$(git rev-parse HEAD^1)" >> $GITHUB_OUTPUT
                echo "diff_after=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
            else
                echo "diff_before=${{ github.event.before }}" >> $GITHUB_OUTPUT
                echo "diff_after=${{ github.event.after }}" >> $GITHUB_OUTPUT
            fi
      - name: List changed files as JSON matrix
        id: list
        run: |
            files=$(git diff --name-only "${{ steps.diff_range.outputs.diff_before }}..${{ steps.diff_range.outputs.diff_after }}" -- '*/*.txt' \
                | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({txt: ., regions: (. | sub("\\.txt$"; ".regions.csv"))})')
            echo "files=${files}" >> $GITHUB_OUTPUT

  preview:
    name: Preview
    needs: enumerate
    if: needs.enumerate.outputs.files != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.enumerate.outputs.files) }}
    steps:
      - uses: actions/checkout@v6
        with:
            ref: ${{ needs.enumerate.outputs.diff_after }}
            fetch-depth: 0
            sparse-checkout: |
                ${{ matrix.entry.txt }}
                ${{ matrix.entry.regions }}
            sparse-checkout-cone-mode: false
      - name: Check out clictagger
        uses: actions/checkout@v6
        with:
          repository: mahlberg-lab/clictagger
          path: clictagger
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            clictagger/setup.py
      - name: Install clictagger from checked out source
        run: pip install ./clictagger
      - name: Generate HTML for ${{ matrix.entry.txt }}
        run: |
            if git cat-file -e '${{ needs.enumerate.outputs.diff_before }}:${{ matrix.entry.txt }}' 2>/dev/null; then
                clictagger --compare-to '${{ needs.enumerate.outputs.diff_before }}' --html index.html '${{ matrix.entry.txt }}'
            else
                clictagger --html index.html '${{ matrix.entry.txt }}'
            fi
      # https://github.com/pavi2410/html-preview-action
      - name: HTML Preview
        id: html_preview
        uses: pavi2410/html-preview-action@b58683c238478d5f8b5dacf4fe5e3f403afb449a
        with:
          html_file: index.html
          site_root: .
          upload: auto
          job_summary: true
      - name: Save link entry
        run: |
            mkdir -p links
            printf -- '- [%s](%s)\n' \
                '${{ matrix.entry.txt }}' \
                '${{ steps.html_preview.outputs.artifact_url }}' \
                > "links/${{ strategy.job-index }}.md"
      - name: Upload link entry
        uses: actions/upload-artifact@v4
        with:
          name: preview-link-${{ strategy.job-index }}
          path: links/${{ strategy.job-index }}.md

  comment:
    name: Comment preview links on PR
    needs: [enumerate, preview]
    if: github.event_name == 'pull_request' && needs.enumerate.outputs.files != '[]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests:
        write
    steps:
      - name: Download link entries
        uses: actions/download-artifact@v4
        with:
          pattern: preview-link-*
          path: links
          merge-multiple: true
      - name: Assemble comment body
        id: body
        run: |
            {
                echo 'body<<COMMENT_EOF'
                echo 'Preview of these changes with CLiC tags:'
                echo ''
                cat links/*.md | sort
                echo 'COMMENT_EOF'
            } >> $GITHUB_OUTPUT
      - name: Comment preview links on PR
        uses: peter-evans/create-or-update-comment@a111a2c3bacd7be7898ee22d0d71d9aec2bb972c
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.body.outputs.body }}
