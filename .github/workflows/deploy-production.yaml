name: Deploy to clic server (production)

# Configure environment with
# Secrets:
# * SSH_KEY: ssh-keygen -t ed25519
# Variables:
# * SSH_PUBKEY: (public key half)
# * SSH_HOST: user@host
# * KNOWN_HOSTS: ssh-keyscan (host)

on:
  workflow_dispatch:

concurrency:
  group: deploy-clic-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:   
    - name: Install SSH key
      if: ${{ vars.KNOWN_HOSTS != '' }}
      uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3
      with:
        key: ${{ secrets.SSH_KEY }}
        known_hosts: ${{ vars.KNOWN_HOSTS }}
    - name: Run update script
      if: ${{ vars.SSH_HOST != '' }}
      run: ssh ${{ vars.SSH_HOST }}
