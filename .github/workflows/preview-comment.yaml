# Posts the HTML preview links generated by preview.yaml as a PR comment.
#
# This runs as a separate `workflow_run` workflow on purpose: for pull requests
# from a fork the GITHUB_TOKEN in the triggering `pull_request` run is read-only,
# so it cannot comment on the PR ("Resource not accessible by integration").
# A `workflow_run` workflow runs in the context of the base repo's default
# branch and therefore gets a read/write token.
# https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/

on:
  workflow_run:
    workflows: ["html-preview"]
    types:
      - completed

name: html-preview-comment

permissions:
  pull-requests: write
  actions: read            # required to download artifacts from the triggering run

jobs:
  comment:
    name: Comment preview links on PR
    # Only act on fork/branch PR runs that actually produced previews.
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download link entries from the triggering run
        uses: actions/download-artifact@v4
        with:
          pattern: preview-link-*
          path: links
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble comment body
        id: body
        run: |
            if ! ls links/*.md >/dev/null 2>&1; then
                echo "No preview link artifacts found, nothing to comment."
                echo "pr_number=" >> "$GITHUB_OUTPUT"
                exit 0
            fi
            echo "pr_number=$(cat links/pr-number.txt)" >> "$GITHUB_OUTPUT"
            {
                echo 'body<<COMMENT_EOF'
                echo 'Preview of these changes with CLiC tags:'
                echo ''
                cat links/*.md | sort
                echo 'COMMENT_EOF'
            } >> "$GITHUB_OUTPUT"
      - name: Comment preview links on PR
        if: steps.body.outputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@a111a2c3bacd7be7898ee22d0d71d9aec2bb972c
        with:
          issue-number: ${{ steps.body.outputs.pr_number }}
          body: ${{ steps.body.outputs.body }}
